spring.application.name=journal-test
spring.datasource.url=jdbc:postgresql://localhost:5433/lola_journal
spring.datasource.username=lola
spring.datasource.password=lola
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

lola.journal.docker.enabled=true
lola.journal.retention.default-days=7
lola.journal.retention.metrics-days=7

lola.journal.s3.endpoint=http://127.0.0.1:9000
lola.journal.s3.region=us-east-1
lola.journal.s3.access-key=lola_admin
lola.journal.s3.secret-key=lola_admin_secret
lola.journal.s3.bucket-name=lola-journal-archives
lola.journal.store.api-url=http://localhost:8086

lola.lci.auth.introspect-url=http://localhost:8080/internal/v1/auth/introspect
lola.security.jwt.secret=lola-cloud-platform-secret-encryption-key-for-jwt-signing-256-bits-minimum
